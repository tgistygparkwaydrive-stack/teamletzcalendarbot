name: Weekly Yu-Gi-Oh! Tournament Scraper (Team Letzebuerg)

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-sync-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright & Headless Chromium (for Live Neuron / KCGN & Konami EU Tables)
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run Tournament Scraper & Push to Database
        env:
          FIREBASE_DB_URL: "https://teamletz-default-rtdb.firebaseio.com"
          SYNC_ROOM_KEY: "TeamLetzebuerg2007_OfficialSync"
          SUPABASE_URL: "https://diprvomnhjhqiypmhfhi.supabase.co"
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python tournament_scraper.py

      - name: Keep GitHub Cron Alive Forever (Prevent 60-Day Pause)
        run: |
          date -u +"%Y-%m-%d %H:%M:%S UTC" > last_sync.txt
          git config user.name "teamletz-bot"
          git config user.email "bot@teamletz.lu"
          git add last_sync.txt
          git commit -m "Auto-Sync Kalender Keep-Alive" && git push || true
